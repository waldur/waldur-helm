include:
  - project: "waldur/waldur-pipelines"
    file: "/templates/release/tag-release.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/stages.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/check-merge-compatibility.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/lint-md-files.yml"

Run linter:
  image:
    name: "registry.hpc.ut.ee/mirror/alpine/helm:3.12.3"
    entrypoint: [""]
  stage: test
  interruptible: true
  rules:
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk update
    - apk add jq python3
    - apk add -X http://dl-cdn.alpinelinux.org/alpine/edge/community -u alpine-keys
    - apk add yq --repository=http://dl-cdn.alpinelinux.org/alpine/edge/community
    - helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.8.2
  script:
    - helm dependency update waldur/
    - helm lint waldur/
    - helm lint waldur/ -f waldur/test/values.yaml
    - helm unittest waldur/
    # lint for correctness of known configuration
    - mkdir rendered-templates && helm template waldur -f waldur/test/values.yaml --output-dir rendered-templates/ --debug
    - yq e '.data."features.json"' rendered-templates/waldur/templates/config-features-json.yml | jq
    - yq e '.data."override.conf.py"' rendered-templates/waldur/templates/config-override.yaml > rendered-templates/waldur/templates/override.conf.py
    - python3 -m py_compile rendered-templates/waldur/templates/override.conf.py
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - rendered-templates

.Test template:
  image: $HELM_TEST_IMAGE
  stage: test
  interruptible: true
  before_script:
    - export KUBECONFIG=${K8S_CONFIG_WALDUR_HELM_TEST}
    - apk update
    - apk add curl git
    - kubectl config view
    - kubectl config current-context
    - helm repo add stable https://charts.helm.sh/stable
    - helm repo add bitnami https://charts.bitnami.com/bitnami
    - helm repo update
    - helm dependency update waldur/

.Cleanup template:
  image: $HELM_TEST_IMAGE
  script:
    - export KUBECONFIG=${K8S_CONFIG_WALDUR_HELM_TEST}
    - helm uninstall waldur || true
    - kubectl delete job waldur-mastermind-init-whitelabeling-job || true
    - kubectl delete pvc -l app.kubernetes.io/instance=waldur --ignore-not-found

Validate release installation (dry-run):
  extends: .Test template
  rules:
    - if: '$SKIP_TESTS == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - helm install waldur waldur/ -f waldur/test/values.yaml --dry-run --debug

Test release installation and readiness:
  extends: .Test template
  # The broker apply can roll the RabbitMQ StatefulSet, and this job shares one
  # `waldur` release with every other pipeline on the test cluster.
  resource_group: waldur-helm-test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - waldur/**/*
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "schedule"'
      changes:
        - waldur/**/*
    - if: $TRIGGER_PROJECT_NAME
      changes:
        - waldur/**/*
  script:
    - set -xv
    # The chart's test values run against an operator-managed broker
    # (rabbitmq.enabled=false, rabbitmq.host=rabbitmq-waldur-test), so the
    # cluster has to exist before `helm install --wait` -- otherwise the
    # mastermind pods block on a Service and a secret that aren't there.
    # `kubectl apply` is idempotent, so a rebuilt test cluster self-heals here
    # rather than needing the CR re-applied by hand.
    - |
      # Probe the namespaced resource, not the CRD: the CI credential is scoped
      # to the test namespace and cannot read cluster-scoped objects, so
      # `kubectl get crd` fails even when the operator is installed. Surface the
      # real kubectl error rather than swallowing it.
      if ! PROBE=$(kubectl get rabbitmqcluster -o name 2>&1); then
        echo "ERROR: cannot list RabbitmqCluster resources in this namespace."
        echo "kubectl said: ${PROBE}"
        echo
        echo "waldur/test/values.yaml sets rabbitmq.enabled=false and expects an"
        echo "operator-managed broker. If the RabbitMQ Cluster Operator is missing,"
        echo "install it once as a cluster admin:"
        echo "  kubectl apply -f https://github.com/rabbitmq/cluster-operator/releases/download/v2.22.5/cluster-operator.yml"
        echo "See docs/rabbitmq-operator.md."
        exit 1
      fi
    - |
      set -e
      RMQ=rabbitmq-waldur-test
      # Server-side apply so field ownership is explicit. The object may already
      # exist without a last-applied-configuration annotation (created by hand),
      # which makes a client-side apply drop unmanaged fields on the *second*
      # run rather than the first.
      kubectl apply --server-side --force-conflicts -f waldur/test/k8s/rabbitmq-cluster.yaml

      # The operator reconciles asynchronously. Immediately after apply the CR
      # still carries the previous generation's status, so waiting on
      # AllReplicasReady straight away can return True for the *old* StatefulSet.
      # Gate on observedGeneration catching up first.
      GEN=$(kubectl get rabbitmqcluster "$RMQ" -o jsonpath='{.metadata.generation}')
      for _ in $(seq 1 24); do
        OBS=$(kubectl get rabbitmqcluster "$RMQ" -o jsonpath='{.status.observedGeneration}' 2>/dev/null || true)
        if [ -n "$OBS" ] && [ "$OBS" -ge "$GEN" ] 2>/dev/null; then break; fi
        sleep 5
      done

      kubectl rollout status "statefulset/${RMQ}-server" --timeout=10m
      kubectl wait --for=condition=AllReplicasReady --timeout=10m "rabbitmqcluster/${RMQ}"

      # helm install --wait would otherwise sit for 20 minutes while every pod
      # fails on a missing secretKeyRef.
      kubectl get "secret/${RMQ}-default-user" -o jsonpath='{.data.username}' >/dev/null

      # The operator derives Service ports from spec.rabbitmq.additionalPlugins,
      # and the chart hard-codes them: 15674 backs templates/ingress-rmq-ws.yaml,
      # 61613/15672 are written into the app config by config-override.yaml.
      # Assert them so a drifted plugin list fails here instead of silently
      # leaving the STOMP event path dead.
      for PORT in 5672 15672 15674 61613; do
        if ! kubectl get "svc/${RMQ}" -o jsonpath="{.spec.ports[?(@.port==${PORT})].port}" | grep -q "^${PORT}$"; then
          echo "ERROR: port ${PORT} is missing from service/${RMQ}."
          echo "Check that waldur/test/k8s/rabbitmq-cluster.yaml still lists rabbitmq_stomp and rabbitmq_web_stomp."
          kubectl get "svc/${RMQ}" -o yaml
          exit 1
        fi
      done
    - helm dep update waldur/
    - helm install waldur waldur/ --wait -f waldur/test/values.yaml --set waldur.pullPolicy=Always --timeout 20m0s
  after_script:
    - set -xv
    - export KUBECONFIG=${K8S_CONFIG_WALDUR_HELM_TEST}
    - helm list
    # The pod loop below filters on app.kubernetes.io/instance=waldur, which the
    # operator's resources do not carry, so a broken broker would otherwise leave
    # no trace in this job's output.
    - kubectl get rabbitmqcluster -o wide || true
    - kubectl get svc rabbitmq-waldur-test -o yaml || true
    - kubectl logs -l app.kubernetes.io/name=rabbitmq-waldur-test --tail=100 --all-containers || true
    - kubectl apply -f waldur/test/k8s/networkpolicy-override.yaml
    - kubectl delete networkpolicy namespace-isolation --ignore-not-found
    - kubectl get pods
    - kubectl get pvc
    - kubectl get events --sort-by=.lastTimestamp | tail -30
    - |
      for NAME in $(kubectl get pods -l app.kubernetes.io/instance=waldur --field-selector status.phase!=Running -o name); do
        echo "Pod name: $NAME"
        kubectl describe $NAME | tail -30
        kubectl logs $NAME --tail 100 --all-containers
        echo ----
      done

.Test ArgoCD template:
  image: registry.hpc.ut.ee/iljatest/docker:24.0.6
  variables:
    APPLICATION_NAME: waldur-helm-$CI_MERGE_REQUEST_IID
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - waldur/**/*
      when: never
  before_script:
    - echo 'PasswordAuthentication no' >> /etc/ssh/ssh_config
    - cat /etc/ssh/ssh_config
    - SSH_COMMAND="ssh -i .ssh/id_waldur_dev_ssh_pkey -o PasswordAuthentication=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null rocky@172.17.89.30"
    - SCP_COMMAND="scp -i .ssh/id_waldur_dev_ssh_pkey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    - mkdir -p .ssh
    - cp -vf $WALDUR_DEV_SSH_PKEY .ssh/id_waldur_dev_ssh_pkey
    - cp -vf $WALDUR_DEV_SSH_PUBKEY .ssh/id_waldur_dev_ssh_pkey.pub
    - chmod 600 .ssh/id_waldur_dev_ssh_pkey
  after_script:
    - rm -fv .ssh/id_waldur_dev_ssh_pkey .ssh/id_waldur_dev_ssh_pkey.pub

Test ArgoCD sync:
  extends: .Test ArgoCD template
  stage: test
  script:
    - echo ${APPLICATION_NAME}
    - $SSH_COMMAND "argocd login 10.43.40.117:80 --username $ARGOCD_USERNAME --password $ARGOCD_PASSWORD --name default --insecure"
    - $SSH_COMMAND "argocd account get-user-info"
    - $SSH_COMMAND "argocd app list"
    - $SSH_COMMAND "argocd repo add https://code.opennodecloud.com/waldur/waldur-helm.git --username gitlab-ci-token --password $CI_JOB_TOKEN --upsert"
    - $SSH_COMMAND "argocd app sync $APPLICATION_NAME --timeout 2400 --prune"
    - $SSH_COMMAND "argocd app wait $APPLICATION_NAME"
    - $SSH_COMMAND "argocd repo rm https://code.opennodecloud.com/waldur/waldur-helm.git"

Cleanup previous test deployment:
  extends: .Cleanup template
  resource_group: waldur-helm-test
  stage: .pre
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "schedule"'

Publish new chart version and update docs on github:
  image:
    name: registry.hpc.ut.ee/mirror/alpine/helm:3.11.2
    entrypoint: [""]
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Configure git
    - git remote -v
    - git remote remove github-origin || true # Cleanup previous session
    - git remote add github-origin https://opennode-jenkins:$OPENNODE_JENKINS_GITHUB_TOKEN@github.com/waldur/waldur-helm.git
    - git remote -v
    - git config user.name "Opennode Jenkins"
    - git config user.email jenkins@opennodecloud.com
    - git fetch github-origin
    # Add version-specific docs
    - cp README.md waldur/
    - cp -r docs/ waldur/
    # Update Chart.yaml and image tags (mastermind + homeport)
    - bash scripts/set-version.sh $CI_COMMIT_TAG
    # Package Waldur chart with a new version
    - helm dependency update waldur/
    - helm package waldur/
    - ls waldur-*.tgz
    - git status
    - git stash
    # Checkout to gh-pages branch
    - git checkout gh-pages
    - git pull github-origin gh-pages
    # Update docs
    - git checkout $CI_COMMIT_TAG -- README.md
    - git checkout $CI_COMMIT_TAG -- docs/
    - git add README.md
    - git add docs/
    # Move archive to directory and update index
    - mkdir charts/ || true
    - mv waldur-$CI_COMMIT_TAG.tgz charts/
    - helm repo index .
    - git add charts/
    - git add index.yaml
    # Push changes
    - git status
    - git commit -m "Release $CI_COMMIT_TAG"
    - git push github-origin gh-pages

