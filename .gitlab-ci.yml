    - helm template waldur | pluto detect --target-versions k8s=v1.19.0 -v 5 -
    - helm template waldur | pluto detect --target-versions k8s=v1.20.0 -v 5 -
    - helm template waldur | pluto detect --target-versions k8s=v1.21.0 -v 5 -
    - helm template waldur | pluto detect --target-versions k8s=v1.22.0 -v 5 -
    - helm template waldur | pluto detect --target-versions k8s=v1.23.0 -v 5 -
    - helm template waldur | pluto detect --target-versions k8s=v1.24.0 -v 5 -
    - helm template waldur | pluto detect --target-versions k8s=v1.25.0 -v 5 -
    - helm template waldur | pluto detect --target-versions k8s=v1.26.0 -v 5 -
    - helm template waldur | pluto detect --target-versions k8s=v1.27.0 -v 5 -
    - helm template waldur | pluto detect --target-versions k8s=v1.28.0 -v 5 -
    - helm template waldur | pluto detect --target-versions k8s=v1.29.0 -v 5 -

# These seds intentionally do NOT reuse scripts/set-version.sh, even though it
# covers the same files. That script additionally pins waldur.homeport.imageTag,
# which must stay empty on the branch so deployment-homeport.yaml can fall back
# to waldur.imageTag; pinning it belongs to the packaged chart only, where the
# publish job applies set-version.sh at package time. The script is also bash,
# and the alpine/git image this job runs on has no bash.
Release tag:
  extends: .release-tag-base
  script:
    - >-
      sed -i -E -e "s/^version: ('.*'|.*)$/version: $RELEASE_VERSION/" waldur/Chart.yaml
    - >-
      sed -i -E -e "s/^appVersion: ('.*'|.*)$/appVersion: \"$RELEASE_VERSION\"/" waldur/Chart.yaml
    - >-
      sed -i -E -e "s/^  imageTag: ('.*'|.*)$/  imageTag: \"$RELEASE_VERSION\"/" waldur/values.yaml
    - git add waldur/Chart.yaml waldur/values.yaml
    # Push to HEAD:$CI_COMMIT_REF_NAME, not HEAD: the runner checks out a
    # detached HEAD, so git cannot infer the remote branch from HEAD alone.
    - git diff --cached --quiet && echo "waldur-helm versions already updated" || (git commit -m "Set target version to ${RELEASE_VERSION}" && git push -o "ci.skip" origin "HEAD:${CI_COMMIT_REF_NAME}")
    - git tag -a $RELEASE_VERSION -m "Release $RELEASE_VERSION" || echo "Tag already exists"
    - git push origin $RELEASE_VERSION || echo "Tag already pushed"
