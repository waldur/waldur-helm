# Reference values for installing PostgreSQL as a SEPARATE release alongside
# Waldur, rather than as the chart's bundled subchart.
#
#   helm install postgresql oci://registry-1.docker.io/cloudpirates/postgres \
#     --version 0.20.1 -f postgresql-values.yaml
#
# nameOverride keeps the Service and Secret named `postgresql-waldur`, which is
# the fallback that templates/_helpers.tpl uses when neither externalDB nor the
# bundled subchart is enabled. Change it here and you must change the helper.
nameOverride: "waldur"

image:
  # Pinned to 17 to match waldur.postgresql.version in _helpers.tpl, which picks
  # the client image for the initdb and backup containers. Move both together.
  tag: "17.6"

auth:
  username: "waldur"
  password: "waldur"
  database: "waldur"

persistence:
  enabled: true
  size: "10Gi"
  storageClass: ""

resources:
  requests:
    cpu: 500m
    memory: 1024Mi
  limits:
    cpu: 1000m
    memory: 2048Mi
