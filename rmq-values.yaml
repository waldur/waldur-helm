# Reference values for installing RabbitMQ as a SEPARATE release alongside
# Waldur, rather than as the chart's bundled subchart.
#
#   helm install rmq oci://registry-1.docker.io/cloudpirates/rabbitmq \
#     --version 0.21.19 -f rmq-values.yaml
#
# This produces a Service named `rmq-rabbitmq`, which is the default of
# `rabbitmq.host` in values.yaml.
image:
  tag: "4.3.5-management"

replicaCount: 3

# REQUIRED whenever replicaCount > 1. This chart does not cluster on its own --
# without the Kubernetes peer discovery plugin, `replicaCount: 3` deploys three
# INDEPENDENT brokers behind one Service. The install looks healthy (3/3 pods
# Ready), but connections are load-balanced across unrelated nodes: a queue
# declared on one node does not exist on the others, `celery inspect ping`
# usually cannot reach the worker's pidbox queue (so the worker's probes fail
# and it crash-loops), and published tasks strand on nodes that have no
# consumer. See docs/rabbitmq.md and #14.
#
# Verify after install -- every pod must list all three nodes:
#   kubectl exec rmq-rabbitmq-0 -c rabbitmq -- rabbitmqctl cluster_status
peerDiscoveryK8sPlugin:
  enabled: true

auth:
  username: "waldur"
  password: "waldur"

# Waldur needs STOMP and web-STOMP in addition to AMQP and the management API.
# This chart does not derive ports from plugin names, so extraPorts below has to
# declare them explicitly: 61613 is what config-override.yaml writes into the
# app config, 15674 is the backend of templates/ingress-rmq-ws.yaml.
additionalPlugins:
  - rabbitmq_stomp
  - rabbitmq_web_stomp
  - rabbitmq_auth_backend_ldap

extraPorts:
  - name: stomp
    port: 61613
    containerPort: 61613
    targetPort: 61613
  - name: stomp-websocket
    port: 15674
    containerPort: 15674
    targetPort: 15674

persistence:
  enabled: true
  size: "10Gi"
  storageClass: ""

resources:
  requests:
    cpu: 1
    memory: 2048Mi
  limits:
    cpu: 2
    memory: 4096Mi
