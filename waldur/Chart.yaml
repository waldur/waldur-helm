apiVersion: v2
name: waldur
type: application
version: 8.1.3-rc.3
appVersion: "8.1.3-rc.3"

description: Waldur - Open-Source Cloud Marketplace
keywords:
  - marketplace
  - openstack
  - vmware
  - slurm
  - billing
home: https://waldur.com
icon: https://waldur.com/assets/img/icon-bot-01-150x240.png
maintainers:
  - name: OpenNode team
    email: info@opennodecloud.com
    url: https://opennodecloud.com

dependencies:
  # Bundled backing services for dev/test installs. Both are plain StatefulSet
  # charts on the official upstream images -- no operator, no CRDs -- so a bare
  # `helm dependency update && helm install` brings up a working stack.
  # Production should use externalDB / an operator-managed broker instead; see
  # docs/postgres-operator.md and docs/rabbitmq-operator.md.
  #
  # The aliases are load-bearing: they make the subchart fullnames
  # `<release>-postgresql` / `<release>-rabbitmq`, which is what
  # templates/_helpers.tpl derives the Service and Secret names from.
  - name: postgres
    version: 0.20.1
    repository: oci://registry-1.docker.io/cloudpirates
    alias: postgresql
    condition: postgresql.enabled
  - name: rabbitmq
    version: 0.21.19
    repository: oci://registry-1.docker.io/cloudpirates
    alias: rabbitmq
    condition: rabbitmq.enabled
