# ConfigMap for marketplace configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: mastermind-marketplace-yaml
data:
  marketplace.yaml: |
    {{ if .Values.waldur.marketplace.notify_staff }}
    # Staff notification settings
    NOTIFY_STAFF_ABOUT_APPROVALS: true
    {{ end }}

    {{ if has "waldur_marketplace_notify_about_resource_change_disabled" .Values.waldur.features }}
    # Resource change notification settings
    NOTIFY_ABOUT_RESOURCE_CHANGE: False
    {{ end }}

    {{ if .Values.waldur.marketplace.countries }}
    # Countries offered in the organization creation dialog.
    # Setting this makes the chart the source of truth: the value is reapplied
    # on every upgrade, overwriting changes made through the admin UI.
    COUNTRIES:
{{ toYaml .Values.waldur.marketplace.countries | indent 6 }}
    {{ end }}

    {{ if and (eq (include "waldur.matrixCallsEnabled" .) "true") (not .Values.matrixChat.setup.enabled) }}
    # Matrix calls: the public wss URL browsers dial, and the URL Waldur's
    # backend calls LiveKit on. Waldur issues call tokens itself (see
    # matrixChat in values.yaml); its key and secret are seeded from the
    # LiveKit Secret by the init-whitelabeling job, not from this ConfigMap.
    # With matrixChat.setup on, the Matrix wiring Job seeds all four instead.
    {{- if not (hasKey .Values.waldur.settingsOverrides "MATRIX_LIVEKIT_PUBLIC_URL") }}
    MATRIX_LIVEKIT_PUBLIC_URL: {{ .Values.matrixChat.livekit.publicUrl | quote }}
    {{- end }}
    {{- if not (hasKey .Values.waldur.settingsOverrides "MATRIX_LIVEKIT_URL") }}
    MATRIX_LIVEKIT_URL: {{ include "waldur.matrixLivekitInternalUrl" . | quote }}
    {{- end }}
    {{ end }}

    {{ if .Values.waldur.settingsOverrides }}
    # Arbitrary runtime setting overrides not covered by a dedicated value
    # above (see waldur.settingsOverrides in values.yaml).
    {{- range $key, $value := .Values.waldur.settingsOverrides }}
    {{ $key }}:
{{ $value | toYaml | indent 6 }}
    {{- end }}
    {{ end }}
