{{- if and .Values.matrixChat.enabled .Values.matrixChat.homeserver.enabled }}
{{- $h := .Values.matrixChat.homeserver }}
{{- if not $h.serverName }}
{{- fail "matrixChat.homeserver.serverName is required when the homeserver is enabled. It is baked into every user/room ID and is the ingress host; rendering with an empty serverName produces a broken homeserver, a catch-all ingress, and a homeport CSP that silently omits the chat host. Set it to your real domain (e.g. matrix.example.org)." }}
{{- end }}
# Tuwunel (Matrix homeserver) configuration. Non-secret config only — the
# registration token is injected as an env override from a Secret, not baked here.
#
# This renders a *template*, not the final config: @LISTEN_ADDRESSES@ is resolved
# by the render-config initContainer in statefulset-matrix-homeserver.yaml at pod
# start. The listen addresses depend on whether the node's kernel has IPv6, which
# helm cannot know at render time, and tuwunel binds every listed address
# explicitly rather than relying on net.ipv6.bindv6only=0 the way gunicorn does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-homeserver-config
  labels:
{{ include "waldur.labels" . | indent 4 }}
data:
  tuwunel.toml: |-
    [global]
    server_name = "{{ $h.serverName }}"
    database_path = "/var/lib/tuwunel"
    address = @LISTEN_ADDRESSES@
    port = [{{ $h.clientPort }}]
    allow_registration = {{ $h.allowRegistration }}
    {{- if and $h.allowRegistration (not $h.registrationToken) (not $h.registrationTokenExistingSecret.name) }}
    {{- fail "matrixChat.homeserver: allowRegistration is true but no registrationToken / registrationTokenExistingSecret is set. Set a registration token to gate user provisioning, or set allowRegistration=false. Refusing to render an open, abusable homeserver." }}
    {{- end }}
    max_request_size = {{ int64 $h.maxRequestSize }}
    {{- /* int64 turns anything it cannot parse into 0, and Tuwunel reads an
         access_token_ttl of 0 as "expire immediately", so check the raw value.
         toJson, not toString: values-file numbers are float64, which toString
         writes as 1e+06 from a million up. */}}
    {{- if or (not (regexMatch "^[0-9]+$" (trimAll "\"" (toJson $h.accessTokenTtl)))) (eq (int64 $h.accessTokenTtl) 0) }}
    {{- fail "matrixChat.homeserver.accessTokenTtl must be a positive whole number of seconds (e.g. 300). Tuwunel treats 0 as 'expire immediately', so the chat drawer could never sign in; duration strings such as 5m are not supported." }}
    {{- end }}
    {{- if or (not (regexMatch "^[0-9]+$" (trimAll "\"" (toJson $h.refreshTokenTtl)))) (and (ne (int64 $h.refreshTokenTtl) 0) (le (int64 $h.refreshTokenTtl) (int64 $h.accessTokenTtl))) }}
    {{- fail "matrixChat.homeserver.refreshTokenTtl must be 0 (never expire) or longer than accessTokenTtl, in whole seconds. A refresh token that expires before the access token is renewed makes every renewal fail." }}
    {{- end }}
    access_token_ttl = {{ int64 $h.accessTokenTtl }}
    refresh_token_ttl = {{ int64 $h.refreshTokenTtl }}
    allow_federation = {{ $h.allowFederation }}
    # Media is only ever shown through the chat clients: refuse to be framed,
    # and allow no inline styles in media served as documents (e.g. SVG).
    media_deny_framing = true
    media_deny_inline_styles = true

    [global.well_known]
    client = "{{ .Values.apiScheme }}://{{ $h.serverName }}"
    server = "{{ $h.serverName }}:443"
    {{- if .Values.matrixChat.lkJwt.enabled }}
    {{- if not $h.livekitServiceUrl }}
    {{- fail "matrixChat.homeserver.livekitServiceUrl is required when lkJwt is enabled: it is the lk-jwt base URL the homeserver advertises to Element Call (e.g. https://<serverName> — do NOT append /sfu, the client adds /get_token itself, so a trailing /sfu yields a 404 on /sfu/get_token). An empty value advertises a broken RTC transport, so calls fail to start with no render-time hint." }}
    {{- end }}

    # LiveKit SFU endpoint for Element Call / Matrix RTC (MSC4143).
    # Advertised only when lk-jwt-service is deployed — the homeserver must not
    # announce a call capability that has no SFU broker behind it.
    [[global.well_known.rtc_transports]]
    type = "livekit"
    livekit_service_url = "{{ $h.livekitServiceUrl }}"
    {{- end }}
{{- end }}
