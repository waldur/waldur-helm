{{ if and (.Values.postgresBackup.enabled) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: waldur-db-backup-rotation-cronjob
spec:
  schedule: {{ .Values.postgresBackup.rotationSchedule | quote }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          {{- if .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- range .Values.imagePullSecrets }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if .Values.hostAliases }}
          hostAliases:
            {{- toYaml .Values.hostAliases | nindent 12 }}
          {{- end }}
          containers:
            - name: "postgres-backup-cronjob"
              image: {{ .Values.global.imageRegistry }}/{{ .Values.postgresBackup.image }}
              imagePullPolicy: {{ include "waldur.imagePullPolicyFromImage" (dict "image" .Values.postgresBackup.image "Values" .Values) }}
              command: ["/bin/sh"]
              args: ["-c", "backup-rotation"]
              env:
                {{ include "waldur.env.initdb" . | nindent 16 }}
                - name: MINIO_SERVER
                  value: {{ .Values.backupStorage.endpoint | quote }}
                {{- include "waldur.backupStorage.credentials" . | nindent 16 }}
                - name: MINIO_BUCKET
                  value: {{ .Values.backupStorage.bucketName | quote }}
                - name: MINIO_API_VERSION
                  value: "S3v4"
              resources:
                {{- toYaml .Values.cronjobResources.postgres | nindent 16 }}
              volumeMounts:
                - name: postgres-backup-rotation-script
                  mountPath: /usr/local/bin/backup-rotation
                  subPath: backup-rotation
          volumes:
            - name: postgres-backup-rotation-script
              configMap:
                name: waldur-db-backup-rotation-script
                defaultMode: 0755
          restartPolicy: Never
{{ end }}
