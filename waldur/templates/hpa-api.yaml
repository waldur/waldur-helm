{{ if .Values.hpa.api.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: waldur-mastermind-api
  minReplicas: {{ .Values.hpa.api.minReplicas | default 1 | int }}
  maxReplicas: {{ .Values.hpa.api.maxReplicas | default 10 | int }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.api.cpuUtilizationBorder }}
{{ end }}
