{{ if .Values.hpa.celery.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: waldur-mastermind-worker
  minReplicas: {{ .Values.hpa.celery.minReplicas | default 1 | int }}
  maxReplicas: {{ .Values.hpa.celery.maxReplicas | default 10 | int }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.celery.cpuUtilizationBorder }}
{{ end }}
