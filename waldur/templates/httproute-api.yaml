{{- if .Values.gatewayAPI.enabled }}
{{- include "waldur.gatewayAPI.assertAvailable" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-httproute
  {{- if .Values.gatewayAPI.annotations }}
  annotations:
    {{- include "waldur.gatewayAPI.annotations" . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "waldur.gatewayAPI.parentRefs" . | nindent 4 }}
  hostnames:
    - {{ .Values.localApiHostname | default .Values.apiHostname | quote }}
    {{- range .Values.apiExtraHosts }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /api-auth
        - path:
            type: PathPrefix
            value: /health-check
      backendRefs:
        - name: waldur-mastermind-api
          port: 80
{{- end }}
