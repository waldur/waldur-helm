{{- if .Values.gatewayAPI.enabled }}
{{- include "waldur.gatewayAPI.assertAvailable" . }}
{{/* The homeport image sends the portal's Content-Security-Policy, so the route
     sets none. Gateway API has no filter for the gateway's own error responses
     only. */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeport-httproute
  {{- if .Values.gatewayAPI.annotations }}
  annotations:
    {{- include "waldur.gatewayAPI.annotations" . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "waldur.gatewayAPI.parentRefs" . | nindent 4 }}
  hostnames:
    - {{ .Values.localHomeportHostname | default .Values.homeportHostname | quote }}
    {{- range .Values.homeportExtraHosts }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: waldur-homeport
          port: 80
{{- end }}
