{{- if and .Values.gatewayAPI.enabled (.Values.waldur.rabbitmqEvents.stompEnabled | default false) }}
{{- include "waldur.gatewayAPI.assertAvailable" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabbitmq-ws-httproute
  {{- if .Values.gatewayAPI.annotations }}
  annotations:
    {{- include "waldur.gatewayAPI.annotations" . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "waldur.gatewayAPI.parentRefs" . | nindent 4 }}
  hostnames:
    - {{ .Values.localApiHostname | default .Values.apiHostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /rmqws-stomp
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /ws
      backendRefs:
        - name: {{ include "waldur.rabbitmq.rmqHost" . | quote }}
          port: 15674
{{- end }}
