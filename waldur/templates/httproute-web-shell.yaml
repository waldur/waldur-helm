{{- if and .Values.gatewayAPI.enabled .Values.waldur.webShell.enabled }}
{{- include "waldur.gatewayAPI.assertAvailable" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-shell-httproute
  {{- if .Values.gatewayAPI.annotations }}
  annotations:
    {{- include "waldur.gatewayAPI.annotations" . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "waldur.gatewayAPI.parentRefs" . | nindent 4 }}
  hostnames:
    - {{ .Values.localApiHostname | default .Values.apiHostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webshell
      backendRefs:
        - name: waldur-mastermind-web-shell
          port: 80
{{- end }}
