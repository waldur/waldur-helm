{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeport-ingress
  annotations:
    {{/* The homeport image sends the portal's Content-Security-Policy. The
         snippets below set one only on the pages the controller generates
         itself (allow-list refusals, body and rate limits, an unreachable
         backend), which never reach the image. */}}
    {{ if eq .Values.ingress.className "nginx" }}
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,sentry-trace,baggage,X-Impersonated-User-Uuid,X-Reauthentication-Grant"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Link, X-Result-Count"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "{{ include "waldur.sslRedirect" (dict "scheme" .Values.homeportScheme "Values" .Values) }}"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      {{ include "waldur.errorPageCspNginx" . }}
    {{ if .Values.ingress.whitelistSourceRange }}
    nginx.ingress.kubernetes.io/whitelist-source-range: "{{ .Values.ingress.whitelistSourceRange }}"
    {{ end }}
    {{ else if or (eq .Values.ingress.className "openshift-default") (eq .Values.ingress.className "haproxy") }}
    haproxy.org/cors-enable: "true"
    haproxy.org/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,sentry-trace,baggage,X-Impersonated-User-Uuid,X-Reauthentication-Grant"
    haproxy.org/cors-expose-headers: "Link, X-Result-Count"
    haproxy.org/ssl-redirect: "{{ include "waldur.sslRedirect" (dict "scheme" .Values.homeportScheme "Values" .Values) }}"
    {{ if and .Values.ingress.tls.enabled (.Values.ingress.tls.source | eq "cluster") }}
    route.openshift.io/termination: "edge"
    {{ end }}
    haproxy.org/backend-config-snippet: |
      {{ include "waldur.errorPageCspHaproxy" . }}
    {{ if .Values.ingress.whitelistSourceRange }}
    haproxy.org/allow-list: "{{ .Values.ingress.whitelistSourceRange }}"
    {{ end }}
    {{ else if eq .Values.ingress.className "traefik" }}
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-homeport-chain@kubernetescrd"
    {{ end }}
    {{ if and .Values.ingress.tls.enabled (eq .Values.ingress.tls.source "letsEncrypt") }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuerName | default "letsencrypt-prod-issuer" }}
    {{ end }}
    {{- include "waldur.ingressAnnotations" . }}
spec:
  {{ if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{ end }}
  rules:
  {{ if .Values.localHomeportHostname }}
  - host: {{ .Values.localHomeportHostname }}
  {{ else }}
  - host: {{ .Values.homeportHostname }}
  {{ end }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: waldur-homeport
            port:
              number: 80
  {{ if .Values.homeportExtraHosts }}
  {{- range .Values.homeportExtraHosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: waldur-homeport
            port:
              number: 80
  {{- end }}
  {{ end }}
  {{ if and .Values.ingress.tls.enabled (.Values.ingress.tls.source | ne "cluster") }}
  tls:
  - hosts:
    - {{ .Values.homeportHostname }}
    {{ if .Values.homeportExtraHosts }}
    {{- range .Values.homeportExtraHosts }}
    - {{ . }}
    {{- end }}
    {{ end }}
    {{ if .Values.ingress.tls.customHomeportSecretName }}
    secretName: {{ .Values.ingress.tls.customHomeportSecretName | quote }}
    {{ else }}
    secretName: homeport-certificate
    {{ end }}
  {{ end }}
{{ end }}
