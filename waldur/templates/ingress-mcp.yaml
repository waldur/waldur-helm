{{- if and .Values.ingress.enabled .Values.waldur.mcp.enabled }}
{{/*
  The remote MCP server and the OAuth endpoints its clients sign in through,
  on the API hosts. Two Ingresses, because on nginx they differ in CORS:

  - mcp-ingress: /mcp and its resource metadata, served by the MCP pods. They
    keep the API's CORS until the server answers CORS itself
    (waldur/waldur-mastermind#1215): browser clients discover the metadata
    through it.
  - mcp-oauth-ingress: the OAuth endpoints, served by the API, which answers
    them with Access-Control-Allow-Origin: * and no credentials. On nginx it
    has no enable-cors: ingress-nginx would answer preflights itself and swap
    * for the caller's origin plus Allow-Credentials. Traefik's api-cors and
    HAProxy's cors-enable answer with * and no credentials, as Waldur does.

  The paths, and why only these /oauth ones, are in waldur.mcp.paths.

  No cert-manager annotation: api-ingress owns the certificate for these
  hosts, and these Ingresses only reference the same Secret.
*/}}
{{- $hosts := prepend .Values.apiExtraHosts (.Values.localApiHostname | default .Values.apiHostname) }}
{{- $corsHeaders := "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,sentry-trace,baggage,X-Impersonated-User-Uuid,X-Reauthentication-Grant,MCP-Protocol-Version" }}
{{- $paths := include "waldur.mcp.paths" . | fromJson }}
{{- $mcp := dict "name" "mcp-ingress" "service" "waldur-mastermind-mcp" "nginxCors" true "paths" $paths.mcp }}
{{- $oauth := dict "name" "mcp-oauth-ingress" "service" "waldur-mastermind-api" "nginxCors" false "paths" $paths.oauth }}
{{- range $route := list $mcp $oauth }}
{{- with $ }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $route.name }}
  annotations:
    {{- if eq .Values.ingress.className "nginx" }}
    {{- if $route.nginxCors }}
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: {{ $corsHeaders | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: "{{ include "waldur.sslRedirect" (dict "scheme" .Values.apiScheme "Values" .Values) }}"
    # As on the API ingress: /oauth/authorize/ redirects to the consent page
    # with the client's whole query in the Location header.
    nginx.ingress.kubernetes.io/proxy-buffer-size: {{ .Values.ingress.proxyBufferSize | default "8k" | quote }}
    # Pages the controller generates itself (allow-list refusals, body and
    # rate limits, an unreachable backend) never reach Waldur. As on the API
    # ingress, not on a 400.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      {{ include "waldur.errorPageCspNginxApi" . }}
    {{- if .Values.ingress.whitelistSourceRange }}
    nginx.ingress.kubernetes.io/whitelist-source-range: "{{ .Values.ingress.whitelistSourceRange }}"
    {{- end }}
    {{- else if or (eq .Values.ingress.className "openshift-default") (eq .Values.ingress.className "haproxy") }}
    haproxy.org/cors-enable: "true"
    haproxy.org/cors-allow-headers: {{ $corsHeaders | quote }}
    haproxy.org/ssl-redirect: "{{ include "waldur.sslRedirect" (dict "scheme" .Values.apiScheme "Values" .Values) }}"
    # HAProxy's own error pages for this backend never reach Waldur. Its
    # frontend's refusals need the controller's frontend-config-snippet
    # (docs/content-security-policy.md).
    haproxy.org/backend-config-snippet: |
      {{ include "waldur.errorPageCspHaproxy" . }}
    {{- if and .Values.ingress.tls.enabled (.Values.ingress.tls.source | eq "cluster") }}
    route.openshift.io/termination: "edge"
    {{- end }}
    {{- if .Values.ingress.whitelistSourceRange }}
    haproxy.org/allow-list: "{{ .Values.ingress.whitelistSourceRange }}"
    {{- end }}
    {{- else if eq .Values.ingress.className "traefik" }}
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-api-chain@kubernetescrd"
    {{- end }}
    {{- include "waldur.ingressAnnotations" . }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
  {{- range $host := $hosts }}
  - host: {{ $host }}
    http:
      # ImplementationSpecific for the /.well-known paths: ingress-nginx 1.12+
      # rejects the whole Ingress when a Prefix path contains a dot. Traefik,
      # HAProxy and OpenShift still match it as a prefix.
      paths:
      {{- range $route.paths }}
      - path: {{ . }}
        pathType: {{ contains "." . | ternary "ImplementationSpecific" "Prefix" }}
        backend:
          service:
            name: {{ $route.service }}
            port:
              number: 80
      {{- end }}
  {{- end }}
  {{- if and .Values.ingress.tls.enabled (.Values.ingress.tls.source | ne "cluster") }}
  tls:
  - hosts:
    - {{ .Values.apiHostname }}
    {{- range .Values.apiExtraHosts }}
    - {{ . }}
    {{- end }}
    secretName: {{ .Values.ingress.tls.customMastermindSecretName | default "api-certificate" | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
