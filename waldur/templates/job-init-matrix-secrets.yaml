{{- if and .Values.matrixChat.enabled .Values.matrixChat.setup.enabled }}
{{- $s := .Values.matrixChat.setup }}
{{- if not $s.existingSecret.name }}
# Phase 1 of zero-touch Matrix setup: mint the appservice tokens.
#
# Runs at pre-install/PreSync, deliberately earlier than the Constance seeding in
# job-init-matrix-wire.yaml, because the homeserver StatefulSet mounts this
# Secret via secretKeyRef and therefore cannot start until it exists. Anything
# that waits for the homeserver to become healthy (helm --wait, an ArgoCD Sync
# wave) would deadlock if the Secret were only created post-install.
#
# This phase does not touch the database, which is why it can run this early —
# the database may not be up yet at pre-install. Constance seeding is the
# separate later Job for exactly that reason.
apiVersion: batch/v1
kind: Job
metadata:
  name: matrix-init-secrets
  labels:
{{ include "waldur.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{ include "waldur.labels" . | nindent 8 }}
    spec:
      serviceAccountName: matrix-init
      {{ if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range $i, $val := .Values.imagePullSecrets }}
        - name: {{ $val }}
        {{ end -}}
      {{ end }}
      containers:
        - name: matrix-init-secrets
          {{- if .Values.waldur.imageDigest }}
          image: {{ .Values.global.imageRegistry }}/{{ .Values.waldur.imageName }}@{{ .Values.waldur.imageDigest }}
          {{- else }}
          image: {{ .Values.global.imageRegistry }}/{{ .Values.waldur.imageName }}:{{ .Values.waldur.imageTag }}
          {{- end }}
          imagePullPolicy: {{ include "waldur.imagePullPolicy" (dict "tag" .Values.waldur.imageTag "Values" .Values) }}
          # matrix-init ships in the mastermind image (/usr/local/bin).
          command:
            - matrix-init
            - secrets
          env:
            - name: SECRET_NAME
              value: {{ $s.secretName | quote }}
          resources:
            {{- toYaml .Values.apiResources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      restartPolicy: "Never"
{{- end }}
{{- end }}
