{{ if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: waldur-mastermind-api-policy
spec:
  podSelector:
    matchLabels:
      app: waldur-mastermind-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    # The pod's port, not the Service's: policy is evaluated after the Service
    # maps 80 to targetPort 8080, and gunicorn listens on nothing else. A rule
    # on 80/443 matched no traffic at all, which dropped every in-namespace
    # caller — the homeserver's appservice transactions among them.
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to: [] 
{{ end }}
