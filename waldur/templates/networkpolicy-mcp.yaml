{{- if and .Values.networkPolicy.enabled .Values.waldur.mcp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: waldur-mastermind-mcp-policy
spec:
  podSelector:
    matchLabels:
      app: waldur-mastermind-mcp
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    # The pod's port, not the Service's: policy is evaluated after the Service
    # maps 80 to targetPort 8091.
    ports:
    - protocol: TCP
      port: 8091
  egress:
  - to: []
{{- end }}
