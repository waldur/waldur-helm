{{- if and .Values.matrixChat.enabled .Values.matrixChat.homeserver.enabled .Values.matrixChat.homeserver.sso.enabled }}
{{- $sso := .Values.matrixChat.homeserver.sso }}
{{- if and $sso.clientSecret (not $sso.clientSecretExistingSecret.name) }}
# Chart-managed secret holding the homeserver's single sign-on client secret,
# mounted as a file. Skipped when clientSecretExistingSecret.name is set.
apiVersion: v1
kind: Secret
metadata:
  name: matrix-homeserver-sso-secret
  labels:
{{ include "waldur.labels" . | indent 4 }}
type: Opaque
stringData:
  client_secret: {{ $sso.clientSecret | quote }}
{{- end }}
{{- end }}
