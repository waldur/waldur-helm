{{ if has "SAML2" .Values.waldur.authMethods }}
{{- $crt := .Files.Glob (printf "%s/credentials/sp.crt" .Values.waldur.saml2.dir) }}
{{- $pem := .Files.Glob (printf "%s/credentials/sp.pem" .Values.waldur.saml2.dir) }}
apiVersion: v1
kind: Secret
metadata:
  name: waldur-saml2-secret
type: Opaque
{{- /* The API, the whitelabeling job and the metadata sync mount this Secret,
so it is rendered even without credential files, empty, to let them start. */}}
{{- if or $crt $pem }}
data:
{{- with $crt }}
{{ .AsSecrets | indent 2 }}
{{- end }}
{{- with $pem }}
{{ .AsSecrets | indent 2 }}
{{- end }}
{{- else }}
data: {}
{{- end }}
{{ end }}
