{{- if and .Values.ingress.enabled (eq .Values.ingress.className "traefik") }}
{{/* The homeport image sends the portal's Content-Security-Policy. Traefik's
     headers middleware cannot set a header on its own error responses only, so
     none is set here. */}}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homeport-redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homeport-headers
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - DNT
      - Keep-Alive
      - User-Agent
      - X-Requested-With
      - If-Modified-Since
      - Cache-Control
      - Content-Type
      - Range
      - Authorization
      - sentry-trace
      - baggage
      - X-Impersonated-User-Uuid
      - X-Reauthentication-Grant
    accessControlExposeHeaders:
      - Link
      - X-Result-Count
      - Content-Length
      - Content-Range
    accessControlAllowOriginList:
      - "*"
    accessControlMaxAge: 100
    addVaryHeader: true
---
{{- if .Values.ingress.whitelistSourceRange }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homeport-ipallowlist
spec:
  ipAllowList:
    sourceRange:
      {{- range (splitList "," .Values.ingress.whitelistSourceRange) }}
      - {{ . | trim | quote }}
      {{- end }}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homeport-chain
spec:
  chain:
    middlewares:
      {{- if eq (include "waldur.sslRedirect" (dict "scheme" .Values.homeportScheme "Values" .Values)) "true" }}
      - name: homeport-redirect-https
      {{- end }}
      - name: homeport-headers
      {{- if .Values.ingress.whitelistSourceRange }}
      - name: homeport-ipallowlist
      {{- end }}
{{- end }}
