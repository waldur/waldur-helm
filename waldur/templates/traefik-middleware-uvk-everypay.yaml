{{- if and .Values.ingress.enabled .Values.waldur.uvkEverypay.enabled (eq .Values.ingress.className "traefik") }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uvk-everypay-redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uvk-everypay-rewrite
spec:
  replacePathRegex:
    regex: ^/uvk-everypay/(.*)
    replacement: /$1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uvk-everypay-chain
spec:
  chain:
    middlewares:
      {{- if eq (include "waldur.sslRedirect" (dict "scheme" .Values.apiScheme "Values" .Values)) "true" }}
      - name: uvk-everypay-redirect-https
      {{- end }}
      - name: uvk-everypay-rewrite
{{- end }}
