# Gateway API overlay -- apply on top of waldur/test/values.yaml:
#   helm template waldur -f waldur/test/values.yaml -f waldur/test/values-gateway.yaml
# Enables gatewayAPI alongside the ingress already enabled by values.yaml, to
# exercise both paths rendering together (see waldur/tests/httproute_test.yaml).
gatewayAPI:
  enabled: true
  createGateway: true
  gatewayClassName: "envoy-gateway"
  tls:
    enabled: true
    source: "letsEncrypt"
    clusterIssuerName: "letsencrypt-prod-issuer"
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "60"
  extraPolicies:
    - |
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      metadata:
        name: waldur-cors
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: api-httproute
        cors:
          allowOrigins:
            - "https://*"
          allowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]

# Exercise httproute-uvk-everypay.yaml too (disabled in the base test values.yaml).
waldur:
  uvkEverypay:
    enabled: true
