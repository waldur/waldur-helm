suite: backup storage credentials
templates:
  - templates/cronjob-waldur-db-backup.yaml
  - templates/cronjob-waldur-db-backup-rotation.yaml
  - templates/deployment-waldur-db-restore.yaml

tests:
  - it: renders the plain values when no existing Secret is named
    set:
      postgresBackup.enabled: true
      backupStorage.accessKey: plain-access
      backupStorage.secretKey: plain-secret
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_ACCESS_KEY
            value: plain-access
        template: templates/cronjob-waldur-db-backup.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_SECRET_KEY
            value: plain-secret
        template: templates/cronjob-waldur-db-backup.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_ACCESS_KEY
            value: plain-access
        template: templates/cronjob-waldur-db-backup-rotation.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_SECRET_KEY
            value: plain-secret
        template: templates/cronjob-waldur-db-backup-rotation.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MINIO_ACCESS_KEY
            value: plain-access
        template: templates/deployment-waldur-db-restore.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MINIO_SECRET_KEY
            value: plain-secret
        template: templates/deployment-waldur-db-restore.yaml

  - it: reads both credentials from the existing Secret with the default keys
    set:
      postgresBackup.enabled: true
      backupStorage.existingSecret.name: backup-s3
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: backup-s3
                key: AWS_ACCESS_KEY_ID
        template: templates/cronjob-waldur-db-backup.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: backup-s3
                key: AWS_SECRET_ACCESS_KEY
        template: templates/cronjob-waldur-db-backup.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: backup-s3
                key: AWS_ACCESS_KEY_ID
        template: templates/cronjob-waldur-db-backup-rotation.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: backup-s3
                key: AWS_SECRET_ACCESS_KEY
        template: templates/cronjob-waldur-db-backup-rotation.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: backup-s3
                key: AWS_ACCESS_KEY_ID
        template: templates/deployment-waldur-db-restore.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: backup-s3
                key: AWS_SECRET_ACCESS_KEY
        template: templates/deployment-waldur-db-restore.yaml

  # The Secret must win over plain values left in a values file, or the
  # credentials would keep leaking into the pod spec after the switch.
  - it: ignores plain values once an existing Secret is named
    set:
      postgresBackup.enabled: true
      backupStorage.accessKey: leftover-access
      backupStorage.secretKey: leftover-secret
      backupStorage.existingSecret.name: backup-s3
      backupStorage.existingSecret.accessKeyKey: id
      backupStorage.existingSecret.secretKeyKey: secret
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: backup-s3
                key: id
        template: templates/cronjob-waldur-db-backup.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: backup-s3
                key: secret
        template: templates/cronjob-waldur-db-backup.yaml
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_ACCESS_KEY
            value: leftover-access
        template: templates/cronjob-waldur-db-backup.yaml
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: MINIO_SECRET_KEY
            value: leftover-secret
        template: templates/cronjob-waldur-db-backup-rotation.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MINIO_SECRET_KEY
            value: leftover-secret
        template: templates/deployment-waldur-db-restore.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: backup-s3
                key: secret
        template: templates/deployment-waldur-db-restore.yaml
