suite: features.json configmap tests
templates:
  - templates/config-features-json.yml

tests:
  - it: should default project.estimated_cost to true
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["features.json"]
          pattern: '"project\.estimated_cost": true'

  - it: should allow overriding project.estimated_cost via featureFlags
    set:
      waldur.featureFlags:
        project.estimated_cost: false
    asserts:
      - matchRegex:
          path: data["features.json"]
          pattern: '"project\.estimated_cost": false'
      - notMatchRegex:
          path: data["features.json"]
          pattern: '"project\.estimated_cost": true'

  - it: should render arbitrary feature flags not covered by waldur.features
    set:
      waldur.featureFlags:
        marketplace.conceal_offering_pricing_tab_in_public_view: true
        support.pricelist: true
        invitations.show_service_accounts: true
    asserts:
      - matchRegex:
          path: data["features.json"]
          pattern: '"marketplace\.conceal_offering_pricing_tab_in_public_view": true'
      - matchRegex:
          path: data["features.json"]
          pattern: '"support\.pricelist": true'
      - matchRegex:
          path: data["features.json"]
          pattern: '"invitations\.show_service_accounts": true'

  - it: should leave telemetry to the admin toggle by default
    asserts:
      - notMatchRegex:
          path: data["features.json"]
          pattern: 'deployment\.send_metrics'

  - it: should switch the telemetry feature off when telemetry is disabled
    set:
      waldur.telemetry.enabled: false
    asserts:
      - matchRegex:
          path: data["features.json"]
          pattern: '"deployment\.send_metrics": false'

  - it: should show the project chat when Matrix chat is enabled
    # Without it there is no chat drawer, no project chat tab and no Matrix
    # admin page after an install that turned Matrix chat on.
    set:
      matrixChat.enabled: true
    asserts:
      - matchRegex:
          path: data["features.json"]
          pattern: '"project\.show_matrix_chat": true'

  - it: should leave the project chat flag alone without Matrix chat
    asserts:
      - notMatchRegex:
          path: data["features.json"]
          pattern: 'project\.show_matrix_chat'

  - it: should let featureFlags hide the project chat with Matrix chat enabled
    set:
      matrixChat.enabled: true
      waldur.featureFlags:
        project.show_matrix_chat: false
    asserts:
      - matchRegex:
          path: data["features.json"]
          pattern: '"project\.show_matrix_chat": false'
      - notMatchRegex:
          path: data["features.json"]
          pattern: '"project\.show_matrix_chat": true'

  - it: should show invoices with VAT when the billing feature is listed
    # Homeport reads the presentation mode from this flag; the old
    # ACCOUNTING_MODE env var on the homeport pod was never read.
    set:
      waldur.features: [billing]
    asserts:
      - matchRegex:
          path: data["features.json"]
          pattern: '"customer\.show_invoices_with_vat": true'

  - it: should leave the invoice presentation flag alone without the billing feature
    asserts:
      - notMatchRegex:
          path: data["features.json"]
          pattern: 'customer\.show_invoices_with_vat'

  - it: should let featureFlags keep accounting records with the billing feature listed
    set:
      waldur.features: [billing]
      waldur.featureFlags:
        customer.show_invoices_with_vat: false
    asserts:
      - matchRegex:
          path: data["features.json"]
          pattern: '"customer\.show_invoices_with_vat": false'
      - notMatchRegex:
          path: data["features.json"]
          pattern: '"customer\.show_invoices_with_vat": true'
