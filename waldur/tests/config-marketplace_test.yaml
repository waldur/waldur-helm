suite: marketplace configmap tests
templates:
  - templates/config-marketplace.yaml

tests:
  - it: should not manage the country list by default
    asserts:
      - isKind:
          of: ConfigMap
      - notMatchRegex:
          path: data["marketplace.yaml"]
          pattern: "COUNTRIES:"

  - it: should render the configured country list
    set:
      waldur.marketplace.countries:
        - EE
        - FI
        - US
        - JP
    asserts:
      - matchRegex:
          path: data["marketplace.yaml"]
          pattern: "COUNTRIES:\n  - EE\n  - FI\n  - US\n  - JP"

  - it: should not render any settings overrides by default
    asserts:
      - notMatchRegex:
          path: data["marketplace.yaml"]
          pattern: "SCIM_INBOUND_ENABLED"

  - it: should render arbitrary settings overrides
    set:
      waldur.settingsOverrides:
        SCIM_INBOUND_ENABLED: true
        MARKETPLACE_LANDING_PAGE: "Catalog"
    asserts:
      - matchRegex:
          path: data["marketplace.yaml"]
          pattern: "SCIM_INBOUND_ENABLED:\\s+true"
      - matchRegex:
          path: data["marketplace.yaml"]
          pattern: "MARKETPLACE_LANDING_PAGE:\\s+Catalog"
