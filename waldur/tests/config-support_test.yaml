suite: support configmap
templates:
  - templates/config-support.yaml

tests:
  - it: leaves support to administrators when the feature is off
    # override.conf.py makes off Waldur's default instead.
    asserts:
      - notMatchRegex:
          path: data["support.yaml"]
          pattern: WALDUR_SUPPORT_ENABLED
      - notMatchRegex:
          path: data["support.yaml"]
          pattern: WALDUR_SUPPORT_ACTIVE_BACKEND_TYPE

  - it: leaves the backend to administrators unless one is chosen
    set:
      waldur.features: [support]
    asserts:
      - matchRegex:
          path: data["support.yaml"]
          pattern: 'WALDUR_SUPPORT_ENABLED: true'
      - notMatchRegex:
          path: data["support.yaml"]
          pattern: "WALDUR_SUPPORT_ACTIVE_BACKEND_TYPE|ATLASSIAN_|ZAMMAD_|SMAX_"

  - it: selects the built-in service desk
    set:
      waldur.features: [support]
      waldur.support.backend: basic
    asserts:
      - matchRegex:
          path: data["support.yaml"]
          pattern: "WALDUR_SUPPORT_ACTIVE_BACKEND_TYPE: 'basic'"
      - notMatchRegex:
          path: data["support.yaml"]
          pattern: "ATLASSIAN_|ZAMMAD_|SMAX_"

  - it: selects atlassian
    set:
      waldur.features: [support]
      waldur.support.backend: atlassian
    asserts:
      - matchRegex:
          path: data["support.yaml"]
          pattern: "WALDUR_SUPPORT_ACTIVE_BACKEND_TYPE: 'atlassian'"
      - matchRegex:
          path: data["support.yaml"]
          pattern: "ATLASSIAN_API_URL"

  - it: selects zammad
    set:
      waldur.features: [support]
      waldur.support.backend: zammad
    asserts:
      - matchRegex:
          path: data["support.yaml"]
          pattern: "WALDUR_SUPPORT_ACTIVE_BACKEND_TYPE: 'zammad'"

  - it: selects smax
    set:
      waldur.features: [support]
      waldur.support.backend: smax
    asserts:
      - matchRegex:
          path: data["support.yaml"]
          pattern: "WALDUR_SUPPORT_ACTIVE_BACKEND_TYPE: 'smax'"
