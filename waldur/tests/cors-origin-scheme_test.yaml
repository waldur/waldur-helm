suite: CORS origins follow homeportScheme
templates:
  - templates/config-override.yaml

set:
  ingress.enabled: true
  homeportHostname: waldur.example.com

tests:
  # The reported bug: the origin was hardcoded to https, so on a plain-http
  # deployment the browser's `Origin: http://...` matched nothing, django-cors-
  # headers emitted no Access-Control-Allow-Origin and every API call failed.
  - it: uses http origins on a plain-http deployment
    templates:
      - templates/config-override.yaml
    set:
      homeportScheme: http
    asserts:
      - matchRegex:
          path: data["override.conf.py"]
          pattern: "'http://waldur\\.example\\.com'"
      - notMatchRegex:
          path: data["override.conf.py"]
          pattern: "'https://waldur\\.example\\.com'"

  - it: uses https origins on an https deployment
    templates:
      - templates/config-override.yaml
    set:
      homeportScheme: https
    asserts:
      - matchRegex:
          path: data["override.conf.py"]
          pattern: "'https://waldur\\.example\\.com'"

  - it: allows every host the portal is served from
    templates:
      - templates/config-override.yaml
    set:
      homeportScheme: https
      homeportExtraHosts:
        - portal.example.com
        - legacy.example.com
    asserts:
      - matchRegex:
          path: data["override.conf.py"]
          pattern: "'https://waldur\\.example\\.com'"
      - matchRegex:
          path: data["override.conf.py"]
          pattern: "'https://portal\\.example\\.com'"
      - matchRegex:
          path: data["override.conf.py"]
          pattern: "'https://legacy\\.example\\.com'"
