suite: image pull secrets on CronJobs and the backup restore pod
templates:
  - templates/cronjob-waldur-db-backup.yaml
  - templates/cronjob-waldur-db-backup-rotation.yaml
  - templates/cronjob-waldur-saml2-metadata-sync.yaml
  - templates/deployment-waldur-db-restore.yaml

tests:
  - it: sets no pull secrets when none are configured
    set:
      postgresBackup.enabled: true
      waldur.authMethods: [LOCAL_SIGNIN, SAML2]
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
        template: templates/cronjob-waldur-db-backup.yaml
      - notExists:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
        template: templates/cronjob-waldur-db-backup-rotation.yaml
      - notExists:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
        template: templates/cronjob-waldur-saml2-metadata-sync.yaml
      - notExists:
          path: spec.template.spec.imagePullSecrets
        template: templates/deployment-waldur-db-restore.yaml

  # A private registry mirror needs the secret on every pod, or the CronJob's
  # pods sit in ImagePullBackOff and the backup silently never runs.
  - it: passes every configured pull secret to each pod
    set:
      postgresBackup.enabled: true
      waldur.authMethods: [LOCAL_SIGNIN, SAML2]
      imagePullSecrets: [regcred, mirror]
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          value:
            - name: regcred
            - name: mirror
        template: templates/cronjob-waldur-db-backup.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          value:
            - name: regcred
            - name: mirror
        template: templates/cronjob-waldur-db-backup-rotation.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          value:
            - name: regcred
            - name: mirror
        template: templates/cronjob-waldur-saml2-metadata-sync.yaml
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: regcred
            - name: mirror
        template: templates/deployment-waldur-db-restore.yaml
