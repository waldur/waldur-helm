suite: homeport CSP with an external LiveKit
templates:
  - templates/deployment-homeport.yaml

# An operator-managed LiveKit (livekit.enabled=false, publicUrl on its own
# host) is dialled by the browser straight from the SPA, so its origin must be
# in the policy's connect-src or the call websocket is refused client-side with
# no server-side trace. The homeport image renders the policy; the chart hands
# it the call origins as CSP_MATRIX_CALL_URL. The bundled LiveKit sits behind
# the homeserver host's /rtc route, which the wss://<serverName> entry covers.
set:
  apiScheme: https
  matrixChat.enabled: true
  matrixChat.homeserver.enabled: true
  matrixChat.homeserver.serverName: "matrix.example.org"

tests:
  - it: passes the external LiveKit origin to the homeport image
    set:
      matrixChat.livekit.enabled: false
      matrixChat.livekit.publicUrl: "wss://livekit.operator.example"
      matrixChat.livekit.keys.existingSecret.name: "operator-livekit-creds"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CSP_MATRIX_CALL_URL
            value: "wss://matrix.example.org wss://livekit.operator.example"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CSP_MATRIX_URL
            value: "https://matrix.example.org"

  # publicUrl may carry a port or a path (wss://lk.op.example:8443/rtc); CSP
  # sources are origins, so only scheme://host[:port] goes in.
  - it: reduces a LiveKit publicUrl with port and path to its origin
    set:
      matrixChat.livekit.enabled: false
      matrixChat.livekit.publicUrl: "wss://livekit.operator.example:8443/rtc"
      matrixChat.livekit.keys.existingSecret.name: "operator-livekit-creds"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CSP_MATRIX_CALL_URL
            value: "wss://matrix.example.org wss://livekit.operator.example:8443"

  - it: lists the homeserver origin once when the bundled LiveKit shares it
    set:
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
      matrixChat.livekit.publicUrl: "wss://matrix.example.org"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CSP_MATRIX_CALL_URL
            value: "wss://matrix.example.org"

  # An https publicUrl on the homeserver host is already CSP_MATRIX_URL, which
  # the image adds to connect-src as well.
  - it: does not repeat the homeserver's https origin as a call origin
    set:
      matrixChat.livekit.enabled: false
      matrixChat.livekit.publicUrl: "https://matrix.example.org/livekit"
      matrixChat.livekit.keys.existingSecret.name: "operator-livekit-creds"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CSP_MATRIX_CALL_URL
            value: "wss://matrix.example.org"

  - it: passes only the homeserver when calls are not configured
    set:
      matrixChat.livekit.publicUrl: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CSP_MATRIX_URL
            value: "https://matrix.example.org"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CSP_MATRIX_CALL_URL
            value: "wss://matrix.example.org"
