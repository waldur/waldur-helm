suite: worker deployment extension hooks
templates:
  - templates/deployment-worker.yaml

tests:
  - it: does not emit CELERY_WORKER_MAX_MEMORY_PER_CHILD by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CELERY_WORKER_MAX_MEMORY_PER_CHILD
          any: true

  - it: renders CELERY_WORKER_MAX_MEMORY_PER_CHILD when celery.maxMemoryPerChild is set
    set:
      celery.maxMemoryPerChild: 400000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CELERY_WORKER_MAX_MEMORY_PER_CHILD
            value: "400000"

  - it: injects worker.extraEnvVars into the container env
    set:
      worker.extraEnvVars:
        - name: WORKER_EXTRA
          value: "yes"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKER_EXTRA
            value: "yes"

  - it: probes ping the pod's own worker over a connection they close
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command[0]
          value: python3
      - matchRegex:
          path: spec.template.spec.containers[0].startupProbe.exec.command[2]
          pattern: 'app\.control\.mailbox\.producer_pool = None'
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[0]
          value: python3
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: 'app\.control\.mailbox\.producer_pool = None'
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[0]
          value: python3
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: 'app\.control\.mailbox\.producer_pool = None'
