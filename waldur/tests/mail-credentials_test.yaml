suite: SMTP credential wiring
templates:
  - templates/deployment-api.yaml
  - templates/secrets.yaml

tests:
  - it: emits neither credential env var when no mail credentials are configured
    template: templates/deployment-api.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_USER
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_PASSWORD
          any: true

  - it: wires both credentials from the chart-managed secret
    template: templates/deployment-api.yaml
    set:
      waldur.mail.username: "waldur@example.com"
      waldur.mail.password: "s3cret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_USER
            valueFrom:
              secretKeyRef:
                name: waldur-secret
                key: MAIL_USER
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: waldur-secret
                key: MAIL_PASSWORD
                optional: true

  # This is the combination that previously produced CreateContainerConfigError:
  # secrets.yaml writes MAIL_USER but not MAIL_PASSWORD, so referencing both
  # unconditionally left a dangling key.
  - it: does not reference MAIL_PASSWORD when only a username is configured
    template: templates/deployment-api.yaml
    set:
      waldur.mail.username: "waldur@example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_USER
            valueFrom:
              secretKeyRef:
                name: waldur-secret
                key: MAIL_USER
                optional: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_PASSWORD
          any: true

  - it: does not reference MAIL_USER when only a password is configured
    template: templates/deployment-api.yaml
    set:
      waldur.mail.password: "s3cret"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_USER
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: waldur-secret
                key: MAIL_PASSWORD
                optional: true

  - it: honors an existing secret reference with custom keys
    template: templates/deployment-api.yaml
    set:
      waldur.mail.existingSecret:
        name: my-vault-secret
        userKey: smtp-user
        passwordKey: smtp-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_USER
            valueFrom:
              secretKeyRef:
                name: my-vault-secret
                key: smtp-user
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-vault-secret
                key: smtp-password
                optional: true

  - it: stores the credentials in the chart-managed secret
    template: templates/secrets.yaml
    set:
      waldur.mail.username: "waldur@example.com"
      waldur.mail.password: "s3cret"
    asserts:
      - equal:
          path: data.MAIL_USER
          value: "d2FsZHVyQGV4YW1wbGUuY29t"
      - equal:
          path: data.MAIL_PASSWORD
          value: "czNjcmV0"
