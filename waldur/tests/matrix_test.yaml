suite: matrix chat stack
templates:
  - templates/ingress-matrix.yaml
  - templates/ingress-api-matrix-livekit.yaml
  - templates/config-marketplace.yaml
  - templates/job-init-whitelabeling.yaml
  - templates/config-tuwunel.yaml
  - templates/config-livekit.yaml
  - templates/networkpolicy-livekit.yaml
  - templates/networkpolicy-matrix-homeserver.yaml
  - templates/networkpolicy-homeport.yaml
  - templates/networkpolicy-mastermind-api.yaml
  - templates/secret-livekit.yaml
  - templates/service-livekit-rtc.yaml
  - templates/ingress-homeport.yaml
  - templates/traefik-middleware-matrix.yaml
  - templates/statefulset-matrix-homeserver.yaml

tests:
  - it: seeds the LiveKit URLs into Waldur when calls are configured
    template: templates/config-marketplace.yaml
    set:
      apiScheme: https
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
      matrixChat.livekit.publicUrl: "wss://matrix.example.org"
    asserts:
      - matchRegex:
          path: data["marketplace.yaml"]
          pattern: 'MATRIX_LIVEKIT_PUBLIC_URL: "wss://matrix.example.org"'
      # Waldur's backend reaches the bundled LiveKit in-cluster, on a dotted
      # name: its URL settings reject single-label hostnames.
      - matchRegex:
          path: data["marketplace.yaml"]
          pattern: 'MATRIX_LIVEKIT_URL: "http://livekit-signaling\.NAMESPACE\.svc:7880"'

  - it: points Waldur's backend at an external LiveKit's public URL
    template: templates/config-marketplace.yaml
    set:
      apiScheme: https
      matrixChat.enabled: true
      matrixChat.livekit.enabled: false
      matrixChat.livekit.publicUrl: "wss://livekit.operator.example.org"
      matrixChat.livekit.keys.existingSecret.name: "operator-livekit-creds"
    asserts:
      - matchRegex:
          path: data["marketplace.yaml"]
          pattern: 'MATRIX_LIVEKIT_URL: "https://livekit.operator.example.org"'

  - it: lets settingsOverrides replace the seeded LiveKit URL
    template: templates/config-marketplace.yaml
    set:
      apiScheme: https
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
      matrixChat.livekit.publicUrl: "wss://matrix.example.org"
      waldur.settingsOverrides:
        MATRIX_LIVEKIT_PUBLIC_URL: "wss://calls.example.org"
    asserts:
      - notMatchRegex:
          path: data["marketplace.yaml"]
          pattern: 'wss://matrix\.example\.org'
      - matchRegex:
          path: data["marketplace.yaml"]
          pattern: 'MATRIX_LIVEKIT_PUBLIC_URL:\s+wss://calls\.example\.org'

  - it: seeds no LiveKit settings without a public LiveKit URL
    template: templates/config-marketplace.yaml
    set:
      matrixChat.enabled: true
    asserts:
      - notMatchRegex:
          path: data["marketplace.yaml"]
          pattern: "MATRIX_LIVEKIT"

  - it: seeds Waldur's LiveKit key and secret from the bundled LiveKit Secret
    # Waldur signs call tokens, so it needs the pair LiveKit verifies them with.
    # They come from the Secret, never from a ConfigMap.
    template: templates/job-init-whitelabeling.yaml
    set:
      apiScheme: https
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
      matrixChat.livekit.publicUrl: "wss://matrix.example.org"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: seed-livekit-credentials
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "(?s)MATRIX_LIVEKIT_SECRET.*waldur override_constance_settings /dev/stdin"
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: LIVEKIT_KEY
            valueFrom:
              secretKeyRef:
                name: livekit-secret
                key: LIVEKIT_API_KEY
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: LIVEKIT_SECRET
            valueFrom:
              secretKeyRef:
                name: livekit-secret
                key: LIVEKIT_API_SECRET

  - it: seeds an external LiveKit's key and secret from its existingSecret
    template: templates/job-init-whitelabeling.yaml
    set:
      apiScheme: https
      matrixChat.enabled: true
      matrixChat.livekit.enabled: false
      matrixChat.livekit.publicUrl: "wss://livekit.operator.example.org"
      matrixChat.livekit.keys.existingSecret.name: "operator-livekit-creds"
    asserts:
      - contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: LIVEKIT_SECRET
            valueFrom:
              secretKeyRef:
                name: operator-livekit-creds
                key: LIVEKIT_API_SECRET

  - it: refuses an external LiveKit without an existingSecret
    template: templates/job-init-whitelabeling.yaml
    set:
      apiScheme: https
      matrixChat.enabled: true
      matrixChat.livekit.enabled: false
      matrixChat.livekit.publicUrl: "wss://livekit.operator.example.org"
    asserts:
      - failedTemplate:
          errorMessage: "matrixChat.livekit.publicUrl points at an external LiveKit (livekit.enabled=false), but matrixChat.livekit.keys.existingSecret.name is unset. Waldur signs call tokens with that LiveKit's API key and secret, and the chart creates livekit-secret only for the bundled server. Point keys.existingSecret.name at a Secret holding your external LiveKit's API key/secret."

  - it: does not seed LiveKit credentials when calls are not configured
    template: templates/job-init-whitelabeling.yaml
    set:
      matrixChat.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1

  - it: routes matrix paths on the serverName host
    template: templates/ingress-matrix.yaml
    set:
      apiScheme: https
      ingress.enabled: true
      ingress.className: nginx
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      # helm-unittest renders the whole chart per test, so every guarded template
      # must get valid config: a registration token for config-tuwunel and
      # livekit keys for secret-livekit, or their fail-closed guards abort the
      # render.
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.livekit.publicUrl: "wss://matrix.example.org"
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      - equal:
          path: spec.rules[0].host
          value: matrix.example.org

  - it: routes no token endpoints to lk-jwt-service on the serverName host
    # Waldur serves the call token API under the API host; the homeserver's
    # host keeps only the Matrix and LiveKit routes.
    template: templates/ingress-matrix.yaml
    set:
      apiScheme: https
      ingress.enabled: true
      ingress.className: nginx
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.livekit.publicUrl: "wss://matrix.example.org"
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      - notMatchRegex:
          path: spec.rules[0].http.paths[*].path
          pattern: "^/(get_token|sfu)$"
      - notMatchRegex:
          path: spec.rules[0].http.paths[*].backend.service.name
          pattern: "lk-jwt"
      # LiveKit's Twirp admin API is reached in-cluster, never publicly.
      - notMatchRegex:
          path: spec.rules[0].http.paths[*].path
          pattern: "^/twirp"
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /rtc
            pathType: Prefix
            backend:
              service:
                name: livekit-signaling
                port:
                  number: 7880

  - it: serves the call token API on the API hosts without nginx's CORS
    # ingress-nginx's enable-cors would replace Waldur's
    # Access-Control-Allow-Origin: * with the caller's origin plus credentials.
    template: templates/ingress-api-matrix-livekit.yaml
    set:
      ingress.enabled: true
      ingress.className: nginx
      apiHostname: api.example.org
      apiExtraHosts:
        - api2.example.org
      matrixChat.enabled: true
    asserts:
      - equal:
          path: spec.rules[0].host
          value: api.example.org
      - equal:
          path: spec.rules[1].host
          value: api2.example.org
      - equal:
          path: spec.rules[0].http.paths[0]
          value:
            path: /api/matrix/livekit
            pathType: Prefix
            backend:
              service:
                name: waldur-mastermind-api
                port:
                  number: 80
      - notExists:
          path: metadata.annotations["nginx.ingress.kubernetes.io/enable-cors"]

  - it: leaves the call token API to the API ingress on traefik
    template: templates/ingress-api-matrix-livekit.yaml
    set:
      ingress.enabled: true
      ingress.className: traefik
      matrixChat.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: serves /.well-known/matrix with a path type ingress-nginx accepts
    # ingress-nginx 1.12+ rejects the whole Ingress when a Prefix or Exact path
    # contains a dot, taking /_matrix and the call routes down with it.
    template: templates/ingress-matrix.yaml
    set:
      apiScheme: https
      ingress.enabled: true
      ingress.className: nginx
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.clientPort: 6167
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.livekit.publicUrl: "wss://matrix.example.org"
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /.well-known/matrix
            pathType: ImplementationSpecific
            backend:
              service:
                name: matrix-homeserver
                port:
                  number: 6167

  - it: defines the matrix-chain middleware the matrix ingress references on traefik
    # ingress-matrix points its traefik router at <ns>-matrix-chain; without this
    # template the router references a non-existent middleware and traefik drops
    # the matrix routes while helm install still reports success.
    template: templates/traefik-middleware-matrix.yaml
    set:
      apiScheme: https
      ingress.enabled: true
      ingress.className: traefik
      # Both chain members are conditional. TLS on keeps matrix-redirect-https,
      # the allow list keeps matrix-ipallowlist, so this asserts the full chain.
      # tests/traefik-ssl-redirect_test.yaml covers the plain-http shape, where
      # the chain is omitted along with the annotation referencing it.
      ingress.tls.enabled: true
      ingress.whitelistSourceRange: "10.0.0.0/8"
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.livekit.publicUrl: "wss://matrix.example.org"
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      - contains:
          path: spec.chain.middlewares
          content:
            name: matrix-redirect-https
        documentSelector:
          path: metadata.name
          value: matrix-chain
      - contains:
          path: spec.chain.middlewares
          content:
            name: matrix-ipallowlist
        documentSelector:
          path: metadata.name
          value: matrix-chain

  - it: refuses to render an open homeserver
    template: templates/config-tuwunel.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.allowRegistration: true
    asserts:
      - failedTemplate:
          errorMessage: "matrixChat.homeserver: allowRegistration is true but no registrationToken / registrationTokenExistingSecret is set. Set a registration token to gate user provisioning, or set allowRegistration=false. Refusing to render an open, abusable homeserver."

  - it: does not advertise an RTC focus without a public LiveKit URL
    template: templates/config-tuwunel.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
    asserts:
      - notMatchRegex:
          path: data["tuwunel.toml"]
          pattern: "rtc_transports"

  - it: points the .well-known RTC focus at Waldur's call token API
    # Element and the chat drawer read org.matrix.msc4143.rtc_foci from
    # .well-known/matrix/client and post to <livekit_service_url>/get_token.
    template: templates/config-tuwunel.yaml
    set:
      apiScheme: https
      apiHostname: waldur-api.example.org
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.livekit.publicUrl: "wss://matrix.example.org"
      matrixChat.livekit.keys.existingSecret.name: "operator-livekit-creds"
    asserts:
      - matchRegex:
          path: data["tuwunel.toml"]
          pattern: '\[\[global\.well_known\.rtc_transports\]\]\s+type = "livekit"\s+livekit_service_url = "https://waldur-api\.example\.org/api/matrix/livekit"'

  - it: ignores a leftover lk-jwt service URL from older values
    template: templates/config-tuwunel.yaml
    set:
      apiScheme: https
      apiHostname: waldur-api.example.org
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.homeserver.livekitServiceUrl: "https://matrix.example.org"
      matrixChat.lkJwt.enabled: true
      matrixChat.livekit.publicUrl: "wss://matrix.example.org"
      matrixChat.livekit.keys.existingSecret.name: "operator-livekit-creds"
    asserts:
      - matchRegex:
          path: data["tuwunel.toml"]
          pattern: 'livekit_service_url = "https://waldur-api\.example\.org/api/matrix/livekit"'
      - notMatchRegex:
          path: data["tuwunel.toml"]
          pattern: 'livekit_service_url = "https://matrix\.example\.org"'

  - it: allows external media into livekit
    template: templates/networkpolicy-livekit.yaml
    set:
      matrixChat.networkPolicy.enabled: true
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      # secret-livekit also renders here — supply keys so its guard doesn't abort.
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      - equal:
          path: spec.ingress[0].from
          value: []

  - it: admits the ingress controller into the homeserver
    # ingress-matrix.yaml publishes clientPort at /_matrix and /.well-known/matrix,
    # so the browser's connection arrives from the ingress controller — a pod in
    # ITS OWN namespace. `podSelector: {}` scopes to the policy's namespace only,
    # so it drops every public request while the in-cluster bot path stays green.
    template: templates/networkpolicy-matrix-homeserver.yaml
    set:
      matrixChat.networkPolicy.enabled: true
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
    asserts:
      - equal:
          path: spec.ingress[0].from
          value: []
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 6167

  - it: renders the livekit policy from its own flag while the global gate is off
    # The decoupling: matrixChat.networkPolicy turns the matrix/livekit policies on
    # while networkPolicy.enabled stays off, so an operator can ship the media rule
    # (what lets calls connect) without opting the whole stack into NetworkPolicy.
    template: templates/networkpolicy-livekit.yaml
    set:
      networkPolicy.enabled: false
      matrixChat.networkPolicy.enabled: true
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ingress[0].from
          value: []

  - it: does not render the livekit policy from the chart-wide flag alone
    # The sever: networkPolicy.enabled gates only homeport/mastermind-api now, so
    # with the matrix flag off the livekit policy must NOT appear even when the
    # global flag is on. Guards the decoupling against regressing back to the OR.
    template: templates/networkpolicy-livekit.yaml
    set:
      networkPolicy.enabled: true
      matrixChat.networkPolicy.enabled: false
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the homeport policy off when only the matrix flag is on
    # matrixChat.networkPolicy must not drag in the chart-wide policies that gate
    # on networkPolicy.enabled alone — that is the whole point of the decoupling.
    template: templates/networkpolicy-homeport.yaml
    set:
      networkPolicy.enabled: false
      matrixChat.networkPolicy.enabled: true
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the mastermind-api policy off when only the matrix flag is on
    template: templates/networkpolicy-mastermind-api.yaml
    set:
      networkPolicy.enabled: false
      matrixChat.networkPolicy.enabled: true
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      - hasDocuments:
          count: 0

  - it: pins livekit media to the single udp_port and explicit node_ip
    template: templates/config-livekit.yaml
    set:
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.rtc.udpPort: 7882
      matrixChat.livekit.rtc.nodeIp: "203.0.113.10"
      # secret-livekit also renders here — supply keys so its guard doesn't abort.
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      # The config file is the only place these take effect — assert the rendered
      # YAML carries the single mux port and the static advertised IP.
      - matchRegex:
          path: data["config.yaml"]
          pattern: "udp_port: 7882"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "node_ip: \"203.0.113.10\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "use_external_ip: false"

  - it: refuses a livekit secret shorter than 32 chars
    template: templates/secret-livekit.yaml
    set:
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "tooshort"
    asserts:
      - failedTemplate:
          errorMessage: "matrixChat.livekit.keys.apiSecret must be at least 32 characters. livekit-server only logs a warning for short secrets and starts anyway, shipping a weak signing key to prod. Generate a strong secret (e.g. `openssl rand -hex 32`) or supply one via keys.existingSecret."

  - it: refuses livekit enabled with no credentials at all
    template: templates/secret-livekit.yaml
    set:
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "matrixChat.livekit is enabled but no API credentials are set. livekit-server would start with no signing key and Waldur could not sign call tokens, so calls fail at runtime with no render-time hint. Set keys.apiKey + keys.apiSecret, or point keys.existingSecret.name at your own Secret."

  - it: injects the matrix homeserver into the homeport CSP when enabled
    template: templates/ingress-homeport.yaml
    set:
      ingress.enabled: true
      ingress.className: nginx
      apiScheme: https
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      # config-tuwunel also renders here — supply a token so its guard doesn't abort.
      matrixChat.homeserver.registrationToken: "s3cret"
    asserts:
      # Chat sync/media (https) and LiveKit call signaling (wss) must be allowed
      # in connect-src or the browser silently blocks them — no server-side error.
      - matchRegex:
          path: metadata.annotations["nginx.ingress.kubernetes.io/configuration-snippet"]
          pattern: "connect-src[^;]*https://matrix.example.org"
      - matchRegex:
          path: metadata.annotations["nginx.ingress.kubernetes.io/configuration-snippet"]
          pattern: "connect-src[^;]*wss://matrix.example.org"

  - it: leaves the homeport CSP untouched when matrix chat is disabled
    template: templates/ingress-homeport.yaml
    set:
      ingress.enabled: true
      ingress.className: nginx
      matrixChat.enabled: false
    asserts:
      - notMatchRegex:
          path: metadata.annotations["nginx.ingress.kubernetes.io/configuration-snippet"]
          pattern: "matrix"

  - it: omits the TURN relay from the livekit config by default
    template: templates/config-livekit.yaml
    set:
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      # No relay unless explicitly enabled — keeps the default footprint minimal.
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "turn:"

  - it: renders a TURNS relay in the livekit config when turn is enabled
    template: templates/config-livekit.yaml
    set:
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
      matrixChat.livekit.turn.enabled: true
      matrixChat.livekit.turn.domain: "turn.matrix.example.org"
      matrixChat.livekit.turn.tlsPort: 5349
      matrixChat.livekit.turn.tls.existingSecret: "livekit-turn-tls"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "tls_port: 5349"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "domain: \"turn.matrix.example.org\""

  - it: refuses a TURN relay without a TLS cert secret
    template: templates/config-livekit.yaml
    set:
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
      matrixChat.livekit.turn.enabled: true
      matrixChat.livekit.turn.domain: "turn.matrix.example.org"
    asserts:
      - failedTemplate:
          errorMessage: "matrixChat.livekit.turn.enabled requires turn.tls.existingSecret: LiveKit terminates TURNS TLS itself and needs a cert/key Secret for turn.domain. Without it livekit-server boots but TURNS never accepts a connection, so symmetric-NAT clients fail silently. Point it at the cert-manager Secret for turn.domain."

  - it: refuses a TURN relay without a domain
    template: templates/config-livekit.yaml
    set:
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
      matrixChat.livekit.turn.enabled: true
      matrixChat.livekit.turn.tls.existingSecret: "livekit-turn-tls"
    asserts:
      - failedTemplate:
          errorMessage: "matrixChat.livekit.turn.enabled requires turn.domain: the hostname clients dial for TURNS and the cert CN they validate. It must resolve to the livekit-rtc LoadBalancer IP (same target as livekit.rtc.nodeIp), NOT serverName, which points at the matrix ingress. An empty domain ships a relay no client can reach."

  - it: exposes the TURNS port on the livekit-rtc load balancer when turn is enabled
    template: templates/service-livekit-rtc.yaml
    set:
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
      matrixChat.livekit.turn.enabled: true
      matrixChat.livekit.turn.domain: "turn.matrix.example.org"
      matrixChat.livekit.turn.tls.existingSecret: "livekit-turn-tls"
    asserts:
      - contains:
          path: spec.ports
          content:
            name: turns
            port: 443
            targetPort: 443
            protocol: TCP

  - it: does not pin externalTrafficPolicy so the media LB defaults to Cluster
    # `Local` only announces the LB VIP from the node running the pod, so the
    # public IP goes dark when the pod reschedules onto a non-announcing node
    # (bare-metal LB-IPAM). Defaulting to `Cluster` announces from any node;
    # rtc.nodeIp pins the advertised ICE address so SNAT no longer flaps it.
    template: templates/service-livekit-rtc.yaml
    set:
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
    asserts:
      - notExists:
          path: spec.externalTrafficPolicy

  - it: runs the homeserver as a single-replica StatefulSet owning its RWO volume
    template: templates/statefulset-matrix-homeserver.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.serviceName
          value: matrix-homeserver
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: data
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: ReadWriteOnce

  - it: adopts an existing claim instead of provisioning one when existingClaim is set
    # The migration path off a prior Deployment-based release: mount its
    # matrix-homeserver-data PVC directly rather than letting the StatefulSet
    # provision a fresh (empty) data-matrix-homeserver-0.
    template: templates/statefulset-matrix-homeserver.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.homeserver.persistence.existingClaim: "matrix-homeserver-data"
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: matrix-homeserver-data

  - it: leaves the listen addresses for the initContainer to resolve at pod start
    template: templates/config-tuwunel.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
    asserts:
      # helm cannot know the node's IP family at render time, so the ConfigMap
      # ships a placeholder rather than a hardcoded 0.0.0.0.
      - matchRegex:
          path: data["tuwunel.toml"]
          pattern: "address = @LISTEN_ADDRESSES@"

  - it: resolves the listen addresses in an initContainer the homeserver reads
    template: templates/statefulset-matrix-homeserver.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: render-config
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: 'if \[ -f /proc/net/if_inet6 \]'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TUWUNEL_CONFIG
            value: /etc/tuwunel/tuwunel.toml

  - it: holds liveness off the homeserver until its migration has finished
    # Tuwunel migrates its database in place before it opens the listener, and
    # a liveness kill mid-migration corrupts it. The startupProbe has to be
    # sized for a large volume, and liveness must still be there afterwards.
    template: templates/statefulset-matrix-homeserver.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /_matrix/client/versions
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 720
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe

  - it: renders short-lived access tokens with an idle refresh lifetime by default
    template: templates/config-tuwunel.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
    asserts:
      # Under [global] itself: Tuwunel silently drops these keys anywhere else.
      - matchRegex:
          path: data["tuwunel.toml"]
          pattern: "\\[global\\]\\n(?:[^\\[\\n][^\\n]*\\n|\\n)*access_token_ttl = 300\\n"
      - matchRegex:
          path: data["tuwunel.toml"]
          pattern: "\\[global\\]\\n(?:[^\\[\\n][^\\n]*\\n|\\n)*refresh_token_ttl = 86400\\n"

  - it: renders overridden token lifetimes
    template: templates/config-tuwunel.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.homeserver.accessTokenTtl: 900
      matrixChat.homeserver.refreshTokenTtl: 43200
    asserts:
      - matchRegex:
          path: data["tuwunel.toml"]
          pattern: "(?m)^access_token_ttl = 900$"
      - matchRegex:
          path: data["tuwunel.toml"]
          pattern: "(?m)^refresh_token_ttl = 43200$"

  - it: accepts lifetimes of a million seconds or more from a values file
    template: templates/config-tuwunel.yaml
    values:
      - values/matrix-month-refresh-ttl.yaml
    asserts:
      - matchRegex:
          path: data["tuwunel.toml"]
          pattern: "(?m)^access_token_ttl = 1000000$"
      - matchRegex:
          path: data["tuwunel.toml"]
          pattern: "(?m)^refresh_token_ttl = 2592000$"

  - it: refuses an access token lifetime Tuwunel would expire at once
    template: templates/config-tuwunel.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.homeserver.accessTokenTtl: 0
    asserts:
      - failedTemplate:
          errorPattern: "accessTokenTtl must be a positive whole number of seconds"

  - it: refuses an access token lifetime given as a duration string
    template: templates/config-tuwunel.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.homeserver.accessTokenTtl: "5m"
    asserts:
      - failedTemplate:
          errorPattern: "accessTokenTtl must be a positive whole number of seconds"

  - it: refuses a missing access token lifetime
    template: templates/config-tuwunel.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.homeserver.accessTokenTtl: null
    asserts:
      - failedTemplate:
          errorPattern: "accessTokenTtl must be a positive whole number of seconds"

  - it: refuses a refresh lifetime that ends before the access token is renewed
    template: templates/config-tuwunel.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.homeserver.refreshTokenTtl: 300
    asserts:
      - failedTemplate:
          errorPattern: "refreshTokenTtl must be 0 \\(never expire\\) or longer than accessTokenTtl"

  - it: refuses a refresh lifetime given as a duration string
    template: templates/config-tuwunel.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.homeserver.refreshTokenTtl: "1d"
    asserts:
      - failedTemplate:
          errorPattern: "refreshTokenTtl must be 0 \\(never expire\\) or longer than accessTokenTtl"

  - it: accepts a refresh token that never expires
    template: templates/config-tuwunel.yaml
    set:
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.example.org"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.homeserver.refreshTokenTtl: 0
    asserts:
      - matchRegex:
          path: data["tuwunel.toml"]
          pattern: "(?m)^refresh_token_ttl = 0$"

  - it: refuses a plaintext ws:// LiveKit URL for calls
    template: templates/job-init-whitelabeling.yaml
    set:
      apiScheme: https
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
      matrixChat.livekit.publicUrl: "ws://matrix.example.org"
    asserts:
      - failedTemplate:
          errorPattern: "matrixChat.livekit.publicUrl must be a wss:// URL"

  - it: refuses a plaintext call token API
    template: templates/job-init-whitelabeling.yaml
    set:
      apiScheme: http
      matrixChat.enabled: true
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
      matrixChat.livekit.publicUrl: "wss://matrix.example.org"
    asserts:
      - failedTemplate:
          errorPattern: 'Matrix calls need apiScheme "https"'

  - it: allows plaintext call transports when explicitly opted in
    template: templates/config-tuwunel.yaml
    set:
      apiScheme: http
      apiHostname: waldur.local
      matrixChat.enabled: true
      matrixChat.homeserver.enabled: true
      matrixChat.homeserver.serverName: "matrix.local"
      matrixChat.homeserver.registrationToken: "s3cret"
      matrixChat.livekit.enabled: true
      matrixChat.livekit.keys.apiKey: "devkey"
      matrixChat.livekit.keys.apiSecret: "0123456789abcdef0123456789abcdef"
      matrixChat.livekit.publicUrl: "ws://matrix.local"
      matrixChat.livekit.allowInsecureTransport: true
    asserts:
      - matchRegex:
          path: data["tuwunel.toml"]
          pattern: 'livekit_service_url = "http://waldur\.local/api/matrix/livekit"'
