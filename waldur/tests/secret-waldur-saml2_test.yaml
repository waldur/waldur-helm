suite: SAML2 credentials Secret
templates:
  - templates/secret-waldur-saml2.yaml

tests:
  - it: renders nothing without SAML2
    asserts:
      - hasDocuments:
          count: 0

  # The packaged chart carries no credential files (waldur_saml2/ is the
  # operator's), and AsSecrets of an empty glob used to render "{}" twice under
  # data:, which is not YAML. The API, the whitelabeling job and the metadata
  # sync mount the Secret, so it must still exist.
  - it: renders an empty Secret when the credential files are absent
    set:
      waldur.authMethods: [LOCAL_SIGNIN, SAML2]
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: waldur-saml2-secret
      - equal:
          path: data
          value: {}
